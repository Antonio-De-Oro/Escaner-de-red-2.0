server.port=8080
spring.application.name=vulnerasolve-network-scanner

# Configuración del motor de escaneo concurrente de red local
scanner.thread-pool-size=30
scanner.ping-timeout-ms=400
scanner.port-timeout-ms=250

# Conexión a la base de datos MariaDB (XAMPP / phpMyAdmin)
spring.datasource.url=jdbc:mariadb://localhost:3306/vulnerasolve?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Configuración de Inteligencia Artificial (Google Gemini)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
