<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulneraSolve — Autenticación y control de acceso</title>
    <!-- Fuentes tipográficas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080d1a;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --border-color: rgba(56, 189, 248, 0.16);
            --border-glow: rgba(0, 212, 255, 0.45);
            
            --primary: #00d4ff;
            --primary-hover: #38bdf8;
            --primary-glow: rgba(0, 212, 255, 0.25);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --danger-border: rgba(239, 68, 68, 0.35);

            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo dinámico estilo red cibernética */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 50% 25%, rgba(0, 212, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(14, 165, 233, 0.07) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 42px 42px, 42px 42px;
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Cabecera / Identidad */
        .brand-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-wrapper {
            width: 76px;
            height: 76px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: 0 0 35px var(--primary-glow);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.2;
        }

        /* Animación en degradado azul y blanco que fluye hacia la derecha sobre SOLVE (idéntico a index) */
        .solve-gradient {
            background: linear-gradient(
                90deg, 
                #00d4ff 0%, 
                #38bdf8 20%, 
                #ffffff 45%, 
                #ffffff 55%, 
                #38bdf8 80%, 
                #00d4ff 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: solvePathFlow 4.5s linear infinite;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
        }

        @keyframes solvePathFlow {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .brand-subtitle {
            font-size: 0.86rem;
            color: var(--text-muted);
            max-width: 340px;
            line-height: 1.45;
        }

        /* Tarjeta de Autenticación */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.65), 0 0 25px rgba(0, 212, 255, 0.08);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .card-header-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .card-header-label h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .security-badge {
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 9px;
            letter-spacing: 0.3px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Alertas de Notificación */
        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #fca5a5;
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #6ee7b7;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dark);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px 12px 42px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }

        .toggle-pwd {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-pwd:hover {
            color: var(--primary);
        }

        /* Botón Primario */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff 0%, #0284c7 100%);
            color: #080d1a;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.45);
            background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Pie de página */
        footer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-dark);
            line-height: 1.5;
        }

        footer strong {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <!-- Logotipo y Marca -->
        <div class="brand-header">
            <div class="logo-wrapper">
                <img src="logo.svg" alt="VulneraSolve" class="logo-img">
            </div>
            <h1 class="brand-title">VULNERA<span class="solve-gradient">SOLVE</span></h1>
            <p class="brand-subtitle">Plataforma de auditoría de red y ciberseguridad</p>
        </div>

        <!-- Tarjeta de Inicio de Sesión -->
        <div class="login-card">

            <div class="card-header-label">
                <h2>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    Autenticación
                </h2>
                <span class="security-badge">Spring Security</span>
            </div>

            <!-- Notificación de Error o Cierre de Sesión dinámico por URL params -->
            <div id="errorAlert" class="alert-box alert-error" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>Credenciales inválidas. Por favor verifique su usuario y contraseña.</span>
            </div>

            <div id="logoutAlert" class="alert-box alert-success" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <span>Sesión cerrada exitosamente de forma segura.</span>
            </div>

            <!-- Formulario de Login -->
            <form action="/login" method="POST" id="loginForm">

                <div class="form-group">
                    <label class="form-label" for="username">Usuario del sistema</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Ingresa tu usuario..." required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Ingresa tu contraseña..." required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Mostrar/ocultar contraseña">
                            <svg id="pwdEyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Iniciar sesión
                </button>

            </form>

        </div>

        <!-- Footer -->
        <footer>
            <strong>VulneraSolve &copy; 2026</strong>
        </footer>

    </div>

    <script>
        // Detectar si hay parámetros de error o logout en la URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            document.getElementById('errorAlert').style.display = 'flex';
        }
        if (urlParams.get('logout')) {
            document.getElementById('logoutAlert').style.display = 'flex';
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('pwdEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                pwdInput.type = 'password';
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        }
    </script>
</body>
</html>
